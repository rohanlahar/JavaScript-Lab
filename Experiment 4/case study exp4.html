<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#050816;
    overflow:hidden;
}

/* Neon Background */

body::before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#00fff2;
    border-radius:50%;
    filter:blur(170px);
    top:-120px;
    left:-100px;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#ff00ff;
    border-radius:50%;
    filter:blur(170px);
    bottom:-120px;
    right:-100px;
}

.container{
    position:relative;
    z-index:10;
    width:470px;
    background:rgba(15,15,25,.9);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 40px rgba(0,255,255,.3);
}

h1{
    color:white;
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    color:#ddd;
    margin-bottom:8px;
    font-weight:500;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:2px solid #00e5ff;
    background:#15152d;
    color:white;
    font-size:16px;
    transition:.3s;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    outline:none;
    border-color:#ff00ff;
    box-shadow:0 0 20px #00e5ff;
}

.buttons{
    display:flex;
    gap:12px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.check{
    background:linear-gradient(135deg,#00e5ff,#007bff);
    color:white;
}

.check:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px cyan;
}

.reset{
    background:linear-gradient(135deg,#ff00ff,#7b2ff7);
    color:white;
}

.reset:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px magenta;
}

#result{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    display:none;
    text-align:center;
    font-size:18px;
    font-weight:600;
}

.success{
    background:#123d28;
    color:#6dff9b;
    border:1px solid #00ff88;
}

.error{
    background:#451824;
    color:#ff8aa5;
    border:1px solid #ff4f7d;
}

.info{
    margin-top:25px;
    color:#ddd;
}

.info h3{
    color:#00ffff;
    margin-bottom:10px;
}

.info ul{
    padding-left:20px;
}

.info li{
    margin-bottom:7px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#888;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<h1>🔄 Palindrome Checker</h1>

<div class="input-group">
<label>Enter a Word or Sentence</label>
<input type="text" id="text" placeholder="Example: Madam">
</div>

<div class="buttons">
<button class="check" onclick="checkPalindrome()">Check</button>
<button class="reset" onclick="resetForm()">Reset</button>
</div>

<div id="result"></div>

<div class="info">
<h3>Concepts Used</h3>
<ul>
<li>✔ Function Types (Named, Anonymous & Arrow Function)</li>
<li>✔ Local and Global Scope</li>
<li>✔ Closures</li>
<li>✔ Try-Catch Exception Handling</li>
<li>✔ DOM Manipulation</li>
</ul>
</div>

<div class="footer">
JavaScript Practical - Palindrome Checker
</div>

</div>

<script>

// Global Variable
const result=document.getElementById("result");

// Named Function
function checkPalindrome(){

    try{

        let input=document.getElementById("text").value.trim();

        if(input==="")
            throw "Please enter some text.";

        // Anonymous Function
        const cleanText=function(str){
            return str.toLowerCase().replace(/[^a-z0-9]/g,"");
        };

        let cleaned=cleanText(input);

        // Arrow Function
        const reverse=str=>str.split("").reverse().join("");

        // Closure
        function palindromeFactory(original){

            let originalText=original;

            return function(){

                return reverse(originalText)===originalText;

            }

        }

        const isPalindrome=palindromeFactory(cleaned);

        result.style.display="block";

        if(isPalindrome()){

            result.className="success";

            result.innerHTML=
            "✅ <b>Palindrome!</b><br><br>"+
            "<b>Input:</b> "+input;

        }

        else{

            result.className="error";

            result.innerHTML=
            "❌ <b>Not a Palindrome</b><br><br>"+
            "<b>Input:</b> "+input;

        }

    }

    catch(error){

        result.style.display="block";

        result.className="error";

        result.innerHTML="⚠ "+error;

    }

}


// Named Function
function resetForm(){

    document.getElementById("text").value="";

    result.style.display="none";

}

</script>

</body>
</html>
